site_name: ZFS for Mere Mortals
site_description: Plain language storage that checks itself. Pools and vdevs, datasets and properties, snapshots you can roll back to, send and receive replication, scrubs that quietly repair damage, replacing a disk without drama, and the habits that keep a home server pool boring for years.
